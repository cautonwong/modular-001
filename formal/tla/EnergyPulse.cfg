\* Small finite instance: two directions (fixed), two bits per lane, two
\* marker slots, granularity 2 so the pending path is exercised, two base
\* generations and three offered pulses per direction so a lane can fill
\* and return FULL and both marker slots can be exhausted. With
\* Granularity <= Capacity <= 8 the C byte-end flush never fires inside a
\* lane this small; the crash protocol is the same arithmetic, so the model
\* is a sound abstraction of a whole-byte lane.
CONSTANTS
    Capacity = 2
    Markers = 2
    Granularity = 2
    MaxGen = 2
    MaxPulses = 3
    Tariffs = 2
INIT Init
NEXT Next
INVARIANT Inv

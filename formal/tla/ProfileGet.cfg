\* Small bounded instance: a 2-slot ring with 3 physical slots (one spare
\* sector worth), two record ids so the predicate partitions the window.
\* NextSequenceBound keeps the otherwise unbounded sequence counter finite.
CONSTANTS
    Records = {1, 2}
    Matching = {1}
    Capacity = 2
    SectorSlots = 1
CONSTRAINT NextSequenceBound
INIT Init
NEXT Next
INVARIANT Inv

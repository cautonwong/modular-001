\* Small bounded instance: a 2-slot ring with 4 physical slots in two
\* two-slot sectors, so an aligned reset or an aligned append erases a whole
\* sector and not just one slot; two record ids partition the window.
CONSTANTS
    Records = {1, 2}
    Matching = {1}
    Capacity = 2
    SectorSlots = 2
CONSTRAINT NextSequenceBound
INIT Init
NEXT Next
INVARIANT Inv
